name: valida-csv
on:
  push:
    paths: ['docs/risorse/**']
  workflow_dispatch:
jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx frictionless==5.21.0 validate --encoding utf-8 docs/risorse/esempi/biblioteche-dizionario.csv
      - run: uvx frictionless==5.21.0 validate --encoding utf-8 --schema docs/risorse/esempi/biblioteche.schema.yaml docs/risorse/esempi/biblioteche.csv
