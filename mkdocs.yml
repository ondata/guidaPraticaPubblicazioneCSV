site_name: Guida pratica alla pubblicazione di dati in CSV
site_url:  https://ondata.github.io/guidaPraticaPubblicazioneCSV/
site_description: Quindici regole per pubblicare dati in CSV che altri possano riusare senza doverli ripulire.


repo_url: https://github.com/ondata/guidaPraticaPubblicazioneCSV
repo_name: guidaPraticaPubblicazioneCSV
edit_uri: edit/main/docs/

copyright: 'Versione 1.0.1, 8 novembre 2026. Un progetto dell''<a href="https://www.ondata.it/" target="_blank">associazione onData</a> | licenza <a href="https://creativecommons.org/licenses/by/4.0/deed.it" target="_blank">CC BY 4.0</a>'

theme:
  name: material
  icon:
    logo: material/table
  highlightjs: true
  custom_dir: overrides
  favicon: imgs/favicon.ico
  palette:
    - scheme: preference
      primary: deep purple
      accent: orange
#      toggle:
#        icon: material/weather-night
#        name: Modalità notte
#    - scheme: slate
#      primary: deep purple
#      accent: orange
#      toggle:
#        icon: material/weather-sunny
#        name: Modalità giorno
  language: it
  features:
    - content.code.annotate
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
  font:
    text: Montserrat
    #code: Cutive Mono
    code: Fira Code


nav:
    - Home: index.md
    - Le regole:
      - guida/linee_guida_pubblicazione/index.md
      - "1. Una sola riga di intestazione": guida/linee_guida_pubblicazione/P01_unica_riga_intestazione.md
      - "2. Una riga per ogni record": guida/linee_guida_pubblicazione/P02_singolo_record_riga.md
      - "3. Nomi di colonna chiari": guida/linee_guida_pubblicazione/P03_denominazione_colonne.md
      - "4. Righe nuove, non colonne nuove": guida/linee_guida_pubblicazione/P04_strutture_dati_verticale_orizzontale.md
      - "5. Se un valore manca": guida/linee_guida_pubblicazione/P05_trattamento_valori_sconosciuti.md
      - "6. Niente totali": guida/linee_guida_pubblicazione/P06_subtotali_totali_raggruppamenti.md
      - "7. Un tipo di dato per colonna": guida/linee_guida_pubblicazione/P07_tipi_dati.md
      - "8. Sempre allo stesso modo": guida/linee_guida_pubblicazione/P08_standardizzazione_valori_campi.md
      - "9. Descrizione accanto ai codici": guida/linee_guida_pubblicazione/P09_campi_codificati.md
      - "10. Testo tra virgolette": guida/linee_guida_pubblicazione/P10_campi_tipo_testo.md
      - "11. Numeri": guida/linee_guida_pubblicazione/P11_campi_tipo_numerico.md
      - "12. Date": guida/linee_guida_pubblicazione/P12_campi_tipo_data.md
      - "13. Telefoni": guida/linee_guida_pubblicazione/P13_campi_tipo_numero_telefonico.md
      - "14. Indirizzi": guida/linee_guida_pubblicazione/P14_campi_tipo_indirizzo_postale.md
      - "15. Coordinate": guida/linee_guida_pubblicazione/P15_campi_con_coordinate_geografiche.md
    - Pratica:
      - Esportare da Excel o LibreOffice: guida/linee_guida_pubblicazione/Linee_guida_importazione_esportazione.md
      - Prima di pubblicare i dati personali: guida/linee_guida_pubblicazione/Dati_personali.md
      - Strumenti di controllo: guida/linee_guida_pubblicazione/Cassetta_attrezzi.md
      - Esempi di CSV italiani: guida/linee_guida_pubblicazione/Esempi_dati_CSV.md
    - Approfondimenti:
      - Perché questa guida: guida/index.md
      - Cos'è un CSV: guida/formato_dati_tabellari.md
      - Il dizionario dei dati: guida/dizionario_dati.md
      - Codici e classificazioni: guida/linee_guida_pubblicazione/Tassonomie_elenchi_codici.md
      - Come servire i file via web: guida/linee_guida_pubblicazione/Considerazioni_archiviazione.md
      - Fonti: guida/linee_guida_pubblicazione/Link_utili.md
    - Partecipa: partecipa.md
    - Grazie: grazie.md

extra:
 social:
    - icon: material/web
      link: https://www.ondata.it/
      name: Sito di onData

# foglio di stile personalizzato
extra_css:
  - stylesheets/style.css

plugins:
  - search:
      lang: it
  - tags

extra_javascript:
#  - https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js
#  - javascripts/tables.js
  - javascripts/varie.js

markdown_extensions:
- admonition
- md_in_html
- attr_list
- footnotes
- meta
- pymdownx.keys
- pymdownx.betterem:
      smart_enable: all
- pymdownx.caret
- pymdownx.critic:
      mode: view
- pymdownx.details
- pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.highlight
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.superfences
- pymdownx.tabbed
- pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
- pymdownx.tilde
- toc:
      permalink: true
      toc_depth: 3

